name: bertopic_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=3.0
  - numpy
  - scikit-learn
  - pytorch
  - tqdm
  - umap-learn
  - hdbscan
  - spacy
  - jupyter
  - notebook
  - ipykernel
  - pip
  - pip:
    - sentence-transformers
    - bertopic
    - bertrend
    - datasets
    - safetensors

# Post-install step — the spaCy model cannot be specified here:
#   python -m spacy download en_core_web_sm
#
# llama-cpp-python is excluded — it must be built from source with Metal flags:
#   CMAKE_ARGS="-DGGML_METAL=on" pip install llama-cpp-python --no-binary llama-cpp-python
